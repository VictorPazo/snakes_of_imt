<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Confirmado</title>
    <style>
        body {
          margin: 0;
          height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          background-color: #f4f6f8;
        }
        .card {
          text-align: center;
          background: #ffffff;
          padding: 48px 40px;
          border-radius: 16px;
          box-shadow: 0 4px 20px rgba(0,0,0,0.08);
          max-width: 360px;
        }
        .icon {
          font-size: 48px;
          margin-bottom: 16px;
        }
        h1 {
          font-size: 22px;
          color: #1a1a1a;
          margin: 0 0 8px;
        }
        p {
          font-size: 15px;
          color: #666;
          margin: 0;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">✅</div>
    <h1>Email confirmado com sucesso!</h1>
    <p>Sua conta já está ativa. Você pode fechar esta página.</p>
</div>
</body>
</html>
